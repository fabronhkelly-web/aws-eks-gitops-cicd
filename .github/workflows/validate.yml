# Fast static checks on every push / PR. Deployment itself is done by Jenkins
# (main branch) or GitHub Actions + Argo CD (gitops branch).
name: validate

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: app
      - name: Docker build
        run: docker build -t hello-world:ci app

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/hello-world
      - run: helm template hello-world charts/hello-world --set image.repository=example/hello-world --set image.tag=ci

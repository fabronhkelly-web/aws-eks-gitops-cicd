# The pipeline overrides image.repository and image.tag on every deploy.
image:
  repository: REPLACE_WITH_ECR_REPOSITORY_URL
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

# ---------------------------------------------------------------------------
# Scaling (challenge spec)
#   * 1 node always on, scalable to 4 (node group, see terraform/eks.tf)
#   * 1 pod per node to start; HPA may add up to 3 pods per node
#     -> maxReplicas = 3 pods x 4 nodes = 12
#   * scale on 50% CPU OR 50% memory (HPA picks whichever needs more pods)
# ---------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 12
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

# Spread replicas evenly across nodes (max difference of 1 pod between nodes).
topologySpread:
  enabled: true
  maxSkew: 1

# The CPU request is what caps each node at 3 app pods:
#   t3.small allocatable CPU      ~1930m
#   DaemonSets (aws-node, kube-proxy) 125m  -> ~1805m free on a fresh node
#   3 x 475m = 1425m fits, 4 x 475m = 1900m does not
#   node 1 also runs the add-ons (~425m)    -> ~1505m free, still fits 3
# When the HPA wants a 4th pod per node, it goes Pending and the Cluster
# Autoscaler adds a node (up to 4). The HPA also measures utilisation
# against these requests (50% of 475m CPU, 50% of 256Mi memory).
resources:
  requests:
    cpu: 475m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 384Mi

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
